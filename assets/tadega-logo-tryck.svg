<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="24mm" viewBox="0 0 1000 240" role="img" aria-label="Tadega AB – Dokumentportalen">
  <!--
    Tadega AB – redigerbar logotyp för tryck (vektorbaserad originalfil).
    Palett: #07172d mörkblå, #ffffff vit, #7fd6c8 turkos, #0f9b8e djup turkos,
    #0b2239 ordmärke.
    Ikonen är rena vektorbanor och kan skalas fritt utan kvalitetsförlust.
    Ordmärket är textobjekt (Inter ExtraBold): öppna filen i Illustrator eller
    Inkscape och redigera namn och färger direkt. Inför tryck: konvertera
    texten till banor (Illustrator: Text → Skapa konturer, Inkscape:
    Path → Object to Path) om tryckeriet saknar Inter.
  -->
  <g id="varumaerke" transform="translate(0 0) scale(0.46875)">
    <rect width="512" height="512" rx="112" fill="#07172d"/>
    <path d="M44 402v-56c0-9 6-17 15-19l54-13 46-58c6-8 15-12 25-12h150c9 0 17 4 23 11l42 47 66 16c9 2 15 10 15 19v45c0 11-9 20-20 20z" fill="#ffffff"/>
    <path d="M136 274l38-47c4-5 9-8 15-8h64v55z" fill="#7fd6c8"/>
    <path d="M266 219h72c6 0 11 2 15 7l30 34-117 4z" fill="#7fd6c8"/>
    <path d="M400 244l24 28 34 8v10l-58-14z" fill="#7fd6c8"/>
    <g stroke="#0f9b8e" stroke-width="3.5" stroke-linecap="round">
      <path d="M320 232v14"/>
      <path d="M313 238l7 6"/>
      <path d="M327 238l-7 6"/>
      <path d="M320 246v8"/>
      <path d="M320 240l-9 5"/>
      <path d="M320 241l8 6"/>
    </g>
    <path d="M74 344h366" stroke="#0f9b8e" stroke-width="7" stroke-linecap="round"/>
    <circle cx="132" cy="400" r="44" fill="#07172d" stroke="#ffffff" stroke-width="10"/>
    <circle cx="420" cy="400" r="44" fill="#07172d" stroke="#ffffff" stroke-width="10"/>
    <circle cx="132" cy="400" r="10" fill="#ffffff"/>
    <circle cx="420" cy="400" r="10" fill="#ffffff"/>

  </g>
  <g id="ordmark" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text id="namn" x="272" y="150" font-size="64" font-weight="800" fill="#0b2239">Dokumentportalen</text>
    <text id="foretag" x="274" y="200" font-size="24" font-weight="600" letter-spacing="7" fill="#0f9b8e">TADGA AB</text>
  </g>
</svg>
